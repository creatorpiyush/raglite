name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the full error message.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code or command to reproduce
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: raglite-toolkit version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22, macOS 15"
  - type: input
    id: providers
    attributes:
      label: Embedding provider, LLM provider and vector store
      placeholder: "local embeddings, anthropic, memory store"
